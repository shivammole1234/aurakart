<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g transform="translate(18, 16)">
    <!-- Analytics Chart Card / Folder -->
    <rect x="6" y="10" width="54" height="42" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Ascending Bar Chart columns in cyan/blue -->
    <rect x="14" y="34" width="7" height="12" rx="2" fill="#38BDF8"/>
    <rect x="25" y="26" width="7" height="20" rx="2" fill="#0284C7"/>
    <rect x="36" y="18" width="7" height="28" rx="2" fill="#2563EB"/>
    <rect x="47" y="22" width="7" height="24" rx="2" fill="#4F46E5"/>

    <!-- Gold coins in foreground -->
    <ellipse cx="50" cy="54" rx="14" ry="7" fill="#F59E0B"/>
    <ellipse cx="50" cy="51" rx="14" ry="7" fill="#FBBF24"/>
    <ellipse cx="36" cy="56" rx="12" ry="6" fill="#D97706"/>
    <ellipse cx="36" cy="53" rx="12" ry="6" fill="#F59E0B"/>

    <!-- Blue Magnifying Glass -->
    <g transform="translate(32, 10)">
      <circle cx="20" cy="20" r="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="4"/>
      <circle cx="20" cy="20" r="8" fill="#BAE6FD" opacity="0.6"/>
      <line x1="30" y1="30" x2="42" y2="42" stroke="#0369A1" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
