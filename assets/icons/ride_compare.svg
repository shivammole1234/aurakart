<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="auto_yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="auto_green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#007744"/>
    </linearGradient>
  </defs>
  <!-- Auto Rickshaw 3D style -->
  <g transform="translate(10, 15)">
    <!-- Cab car in background -->
    <rect x="25" y="10" width="48" height="30" rx="8" fill="#E2E8F0"/>
    <rect x="30" y="14" width="16" height="12" rx="3" fill="#38BDF8"/>
    <rect x="50" y="14" width="18" height="12" rx="3" fill="#38BDF8"/>
    <circle cx="36" cy="40" r="7" fill="#1E293B"/>
    <circle cx="62" cy="40" r="7" fill="#1E293B"/>
    <!-- Yellow Taxi Roof Light -->
    <rect x="42" y="6" width="14" height="5" rx="2" fill="#F59E0B"/>

    <!-- Auto Rickshaw in foreground -->
    <path d="M6 35L16 16C18 13 22 11 26 11H52C55 11 58 14 58 18V44H10C7 44 5 40 6 35Z" fill="url(#auto_yellow)"/>
    <path d="M6 32H58V45H10C7 45 5 40 6 32Z" fill="url(#auto_green)"/>
    <!-- Windshield -->
    <path d="M16 17L9 30H24V17H16Z" fill="#E0F2FE"/>
    <!-- Handlebar/headlight -->
    <circle cx="6" cy="33" r="4" fill="#FDE047"/>
    <!-- Wheels -->
    <circle cx="14" cy="50" r="9" fill="#0F172A"/>
    <circle cx="14" cy="50" r="4" fill="#94A3B8"/>
    <circle cx="48" cy="50" r="9" fill="#0F172A"/>
    <circle cx="48" cy="50" r="4" fill="#94A3B8"/>
  </g>
</svg>
